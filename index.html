<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acuario Crystal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>

    </header>

    <main>

        <div class="contenedor-parallax">
            <div class="vinieta"></div>
            <img src="Imagenes/Fondo.png" data-speedx="0.17" data-speedy="0.20" data-speedz="0" data-rotation="0.27" data-distance="900" class="parallax bg-img">
            
            <img src="Imagenes/Titulo.png" data-speedx="0.1" data-speedy="0.15" data-speedz="0.15" data-rotation="0.02" data-distance="500" class="imagen-titulo">
            <img src="Imagenes/CoralFondo.png" data-speedx="0.3" data-speedy="0.18" data-speedz="0.11" data-rotation="0.2" data-distance="900" class="parallax coral-fondo">
            <img src="Imagenes/PezPayaso.png" data-speedx="0.15" data-speedy="0.1" data-speedz="0.20" data-rotation="0.5" data-distance="800" class="parallax pez-payaso">
            <img src="Imagenes/PezCirujano.png" data-speedx="0.15" data-speedy="0.08" data-speedz="0.25" data-rotation="0.5" data-distance="800" class="parallax pez-cirujano">
            <img src="Imagenes/CoralDerechaPrueba.png" data-speedx="0.22" data-speedy="0.06" data-speedz="0.32" data-rotation="0.1" data-distance="1800" class="parallax coral-derecho">
            <img src="Imagenes/Algas.png" data-speedx="0.18" data-speedy="0.0500" data-speedz="0.30" data-rotation="0.2" data-distance="200" class="parallax algas">
            <img src="Imagenes/Piedra.png" data-speedx="0.15" data-speedy="0.0300" data-speedz="0.25" data-rotation="0.3" data-distance="700" class="parallax piedra">
            
            <img src="Imagenes/CoralIzquierdaPrueba.png" data-speedx="0.10" data-speedy="0.0100" data-speedz="0.53" data-rotation="0.4" data-distance="3500" class="parallax coral-izquierdo">
            


        </div>
        <div>
            hola a todos
        </div>

        
    </main>


    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="app.js"></script>
    
</body>
</html>
